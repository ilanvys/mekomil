name: Refresh catalog metadata

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install catalog generator dependencies
        run: python -m pip install -r mcp/scripts/requirements.txt
      - name: Build catalog candidate
        run: python mcp/scripts/build_catalog.py --refresh --verify
      - name: Test catalog generator
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build manifest and validate service
        working-directory: mcp
        run: |
          npm ci
          npm run manifest
          npm test
          npm run typecheck
      - name: Validate catalog, manifest, and generated plugin
        run: python tools/check_refresh.py
      - name: Reject catastrophic catalog loss
        run: python tools/check_refresh_delta.py
      - name: Commit validated refresh
        run: |
          git add mcp/data/catalog mcp/data/manifest.json
          if git diff --cached --quiet; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh skills-il catalog metadata"
          git push origin HEAD:main
